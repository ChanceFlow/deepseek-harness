# One-way mirror of the fork's master onto the GitHub fork.
# The Gitea repo is the source of truth (upstream merges land there via
# sync-upstream.yml); this workflow pushes each master update to
# github.com/ChanceFlow/deepseek-harness using the host gh CLI
# (runs-on: dsh-host authenticates as the logged-in gh account; the runner
# env provides HTTP(S)_PROXY for github.com reachability).
#
# History sanitization: Gitea history is LAN-only and carries internal
# addresses, host paths, and a personal author email; the GitHub copy must
# not. Each run rewrites a throwaway mirror clone with git-filter-repo
# (literal text and message replacements + a mailmap) and force-pushes the
# rewritten refs. Gitea history is never rewritten, so LAN installs and npm
# gitHead provenance keep working; GitHub SHAs intentionally differ from
# Gitea SHAs, which is why DIFF.md's commit references resolve on Gitea only.
#
# The push is forced: nothing but this workflow writes the fork's master.
# The GitHub fork is read-only downstream; do not open PRs or branches
# against it expecting persistence.
name: Push to GitHub fork

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: push-to-github
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: dsh-host
    env:
      UPSTREAM_GH: deepseek-ai/deepseek-harness
      GH_FORK: ChanceFlow/deepseek-harness
      GITEA_URL: ${{ github.server_url }}/${{ github.repository }}.git
    steps:
      - name: Ensure the GitHub fork exists
        run: |
          set -euo pipefail
          if ! gh repo view "$GH_FORK" >/dev/null 2>&1; then
            gh repo fork "$UPSTREAM_GH" --clone=false
            for _ in $(seq 1 30); do
              git ls-remote "https://github.com/$GH_FORK.git" HEAD >/dev/null 2>&1 && break
              sleep 2
            done
          fi

      - name: Sanitized mirror push
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          WORK="$(mktemp -d /tmp/gh-fork-mirror.XXXXXX)"
          trap 'rm -rf "$WORK"' EXIT
          git clone --quiet --mirror "$GITEA_URL" "$WORK/mirror.git"
          # filter-repo splits expressions at "==>" without trimming the left
          # side, so no spaces may appear around the arrow. Blob and message
          # passes are separate flags. The YAML block scalar strips the base
          # indent, so the heredoc bodies carry no leading whitespace when the
          # shell reads them.
          cat > "$WORK/replace.txt" <<'REPLACE-EOF'
          <proxy-host>==><proxy-host>
          <gitea-host>==><gitea-host>
          <gitea-legacy-host>==><gitea-legacy-host>
          <proxy-legacy-host>==><proxy-legacy-host>
          /home/<user>==>/home/<user>
          175793383+ChanceFlow@users.noreply.github.com==>175793383+ChanceFlow@users.noreply.github.com
          REPLACE-EOF
          cat > "$WORK/mailmap" <<'MAILMAP-EOF'
          Chance <175793383+ChanceFlow@users.noreply.github.com> <175793383+ChanceFlow@users.noreply.github.com>
          MAILMAP-EOF
          git -C "$WORK/mirror.git" filter-repo --force \
            --mailmap "$WORK/mailmap" \
            --replace-text "$WORK/replace.txt" \
            --replace-message "$WORK/replace.txt"
          git -C "$WORK/mirror.git" push --force \
            "https://github.com/$GH_FORK.git" \
            'refs/heads/master:refs/heads/master' \
            '+refs/tags/*:refs/tags/*'
          echo "Synced sanitized master $(git -C "$WORK/mirror.git" rev-parse --short refs/heads/master) to github.com/$GH_FORK"

      - name: Report failure
        if: ${{ failure() }}
        run: echo "::error::GitHub fork sync failed. Check gh auth, proxy, filter-repo availability, and dsh-host runner health."
