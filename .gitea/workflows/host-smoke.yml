# Read-only smoke for the dsh-host runner: proves host jobs can reach the
# repo checkout, pnpm, and the user systemd units without changing anything.
# Trigger: git push origin master:ci-host-smoke (or any push to that branch).
name: Host runner smoke

on:
  push:
    branches: [ci-host-smoke]

jobs:
  smoke:
    runs-on: dsh-host
    steps:
      - name: Verify host-side capabilities
        run: |
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          echo "user: $(whoami)"
          git -C /home/<user>/Projects/deepseek-harness rev-parse --short HEAD
          pnpm --version
          systemctl --user is-active dsh dsh-staging act-runner-host
