# Fork CI: typecheck + the suites that own the fork's behavioral deltas.
# Container runner (docker jobs); pnpm store persists on a host volume.
# Registries are reached directly: npmmirror (lockfile URLs) and the Gitea
# npm registry on <gitea-legacy-host>. The host ~/.npmrc is NOT mounted as-is — its
# localhost:7890 proxy is unreachable inside job containers — only its
# _authToken is reused, via the generated /root/.npmrc.
name: Check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
      options: --sysctl net.ipv6.conf.all.disable_ipv6=1
      volumes:
        - /home/<user>/.cache/ci-pnpm:/ci/pnpm
        - /home/<user>/.npmrc:/ci/secret-npmrc:ro
    env:
      npm_config_store_dir: /ci/pnpm
      COREPACK_NPM_REGISTRY: https://registry.npmmirror.com
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (pinned by packageManager)
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - name: Generate a direct-routing .npmrc
        run: |
          {
            echo 'registry=https://registry.npmmirror.com'
            echo '@deepseek-ai:registry=http://<gitea-legacy-host>:3000/api/packages/Chance/npm/'
            echo '@earendil-works:registry=http://<gitea-legacy-host>:3000/api/packages/Chance/npm/'
            grep _authToken /ci/secret-npmrc
          } > /root/.npmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only 2>&1 | tee /ci/pnpm/install.log
      - name: Probe the fork npm registry wiring (scope routing + auth)
        run: npm dist-tag ls @deepseek-ai/dsh
      - name: Typecheck
        run: pnpm run typecheck
      - name: Fork-delta suites (llm-pi-ai, client-connection)
        run: pnpm exec vitest run packages/llm/llm-pi-ai/ packages/client/connection/
