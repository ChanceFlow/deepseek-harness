# Fork release: tag dsh-v* triggers build -> mirror the pinned native packages
# -> pack -> publish to the Gitea npm registry -> latest dist-tag, then
# auto-deploys staging (:3081, source checkout). Production (:3080) is NOT
# touched here — use deploy.yml manually.
# Registries are reached directly (npmmirror + the Gitea npm registry); the
# host ~/.npmrc's localhost proxy is unreachable inside job containers, so the
# job generates /root/.npmrc from the mounted token only.
name: Release

on:
  push:
    tags: ['dsh-v*']

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
      options: --sysctl net.ipv6.conf.all.disable_ipv6=1
      volumes:
        - /home/<user>/.cache/ci-pnpm:/ci/pnpm
        - /home/<user>/.npmrc:/ci/secret-npmrc:ro
    env:
      npm_config_store_dir: /ci/pnpm
      COREPACK_NPM_REGISTRY: https://registry.npmmirror.com
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (pinned by packageManager)
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - name: Generate a direct-routing .npmrc
        run: |
          {
            echo 'registry=https://registry.npmmirror.com'
            echo "@deepseek-ai:registry=${GITHUB_SERVER_URL}/api/packages/${GITHUB_REPOSITORY_OWNER}/npm/"
            echo "@earendil-works:registry=${GITHUB_SERVER_URL}/api/packages/${GITHUB_REPOSITORY_OWNER}/npm/"
            grep _authToken /ci/secret-npmrc
          } > /root/.npmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the family (official client profile)
        run: pnpm run build:official
      - name: Verify the release set
        run: pnpm run release:verify --family dsh
      # The fork builds neither native/system (one runner per platform) nor the
      # public @deepseek-ai dependencies upstream pins, so every version this
      # checkout pins is mirrored from the public registry before anything is
      # published: four dsh packages install the addon, others install the
      # pinned dependencies, and a consumer must never resolve a release whose
      # package the registry lacks. The source is npmmirror, the registry this
      # job already installs from.
      - name: Mirror the pinned @deepseek-ai packages
        run: pnpm run release:mirror-packages --source https://registry.npmmirror.com
      - name: Pack
        run: pnpm run release:pack --family dsh --out dist/npm-release
      - name: Publish to the fork registry
        # No macOS signing runner publishes here; the CUA provider ships from
        # sources only, so its notarized helper payload is not verified.
        env:
          DSH_RELEASE_CUA_PAYLOAD: source-only
        run: pnpm run release:publish --family dsh --from dist/npm-release
      - name: Point the latest dist-tag at every member
        run: |
          version=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": "([^"]+)".*/\1/')
          ls dist/npm-release/*.tgz \
            | sed -E "s|.*/deepseek-ai-(.*)-${version}\.tgz\$|@deepseek-ai/\1|" \
            | while read -r pkg; do npm dist-tag add "$pkg@${version}" latest; done

  deploy-staging:
    needs: release
    runs-on: dsh-host
    env:
      TAG: ${{ gitea.ref_name }}
    steps:
      - name: Check out the released tag into the staging worktree and restart staging
        run: |
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          # A tag checkout invalidates the incremental client build, and rebuilding
          # every referenced project exceeds Node's default ~2 GiB heap: tsc -b
          # aborted with "Ineffective mark-compacts near heap limit" on the
          # 0.2.2-rc.1 release. Give both faces room before building.
          export NODE_OPTIONS=--max-old-space-size=8192
          REPO=/home/<user>/Projects/deepseek-harness
          STAGING=/home/<user>/Projects/deepseek-harness-staging
          # Never check out a tag in the developer's working tree: that discards
          # uncommitted work (the 0.2.2-rc.2 deploy did exactly that). Stage from a
          # detached worktree dedicated to the dsh-staging service; its launcher
          # runs from the same path.
          cd "$REPO"
          git fetch origin --tags --prune
          if git worktree list --porcelain | grep -Fxq "worktree $STAGING"; then
            git worktree remove --force "$STAGING"
          fi
          rm -rf "$STAGING"
          git worktree add --force --detach "$STAGING" "refs/tags/$TAG"
          # The fork registry routing and token live in the checkout's gitignored
          # .npmrc; installs in the worktree resolve @deepseek-ai through it.
          cp "$REPO/.npmrc" "$STAGING/.npmrc"
          cd "$STAGING"
          pnpm install --frozen-lockfile
          # The source launch serves the checkout's built client bundles, and
          # the web frontend imports their exported assets: build both faces
          # before the frontend, or a checkout without prior build output fails
          # on a missing package asset (2026-09-25 rc.2 release).
          pnpm run build:lib
          pnpm run build:web
          systemctl --user restart dsh-staging
          systemctl --user is-active dsh-staging
          # Probe staging with the process launch token the service writes to its
          # log, so a broken build fails the release instead of staying green.
          LOG=$HOME/services/dsh-staging/staging.log
          url=
          for _ in $(seq 1 30); do
            # The banner names the bind address (0.0.0.0); probe loopback directly and
            # skip any configured proxy so the host proxy cannot answer with its 502.
            url=$(grep -Eo 'https?://[^[:space:]]*token=[^[:space:]]*' "$LOG" 2>/dev/null | tail -1 | sed 's/0\.0\.0\.0/127.0.0.1/' || true)
            if [ -n "$url" ]; then break; fi
            sleep 2
          done
          if [ -n "$url" ]; then
            # The token exchange answers 303 with the browser cookie; follow it
            # with a cookie jar and require the authenticated page itself. Retry
            # so the probe tolerates the handler settling after the banner.
            jar=$(mktemp)
            code=000
            for _ in $(seq 1 30); do
              code=$(curl -s -L -c "$jar" -b "$jar" --noproxy '*' -o /dev/null -w '%{http_code}' "$url")
              if [ "$code" = 200 ]; then break; fi
              sleep 2
            done
            rm -f "$jar"
            echo "staging authenticated probe: $code"
            test "$code" = 200
          else
            code=$(curl -s --noproxy '*' -o /dev/null -w '%{http_code}' http://127.0.0.1:3081/)
            echo "staging unauthenticated probe: $code"
            test "$code" = 401
          fi
