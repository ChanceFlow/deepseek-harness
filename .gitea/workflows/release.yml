# Fork release: tag dsh-v* triggers build -> mirror the pinned native packages
# -> pack -> publish to the Gitea npm registry -> latest dist-tag, then
# auto-deploys staging (:3081, source checkout). Production (:3080) is NOT
# touched here — use deploy.yml manually.
# Registries are reached directly (npmmirror + the Gitea npm registry); the
# host ~/.npmrc's localhost proxy is unreachable inside job containers, so the
# job generates /root/.npmrc from the mounted token only.
name: Release

on:
  push:
    tags: ['dsh-v*']

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
      options: --sysctl net.ipv6.conf.all.disable_ipv6=1
      volumes:
        - /home/<user>/.cache/ci-pnpm:/ci/pnpm
        - /home/<user>/.npmrc:/ci/secret-npmrc:ro
    env:
      npm_config_store_dir: /ci/pnpm
      COREPACK_NPM_REGISTRY: https://registry.npmmirror.com
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (pinned by packageManager)
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - name: Generate a direct-routing .npmrc
        run: |
          {
            echo 'registry=https://registry.npmmirror.com'
            echo "@deepseek-ai:registry=${GITHUB_SERVER_URL}/api/packages/${GITHUB_REPOSITORY_OWNER}/npm/"
            echo "@earendil-works:registry=${GITHUB_SERVER_URL}/api/packages/${GITHUB_REPOSITORY_OWNER}/npm/"
            grep _authToken /ci/secret-npmrc
          } > /root/.npmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the family (official client profile)
        run: pnpm run build:official
      - name: Verify the release set
        run: pnpm exec tsx scripts/release/verify.ts --family dsh
      # The fork cannot build native/system (one runner per platform), so the
      # version this checkout pins is mirrored from the public registry before
      # anything is published: four dsh packages install it, and a consumer
      # must never resolve a release whose addon the registry lacks. The source
      # is npmmirror, the registry this job already installs from.
      - name: Mirror the pinned native addon packages
        run: pnpm exec tsx scripts/release/mirror-native.ts --source https://registry.npmmirror.com
      - name: Pack
        run: pnpm exec tsx scripts/release/pack.ts --family dsh --out dist/npm-release
      - name: Publish to the fork registry
        run: pnpm exec tsx scripts/release/publish.ts --family dsh --from dist/npm-release
      - name: Point the latest dist-tag at every member
        run: |
          version=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": "([^"]+)".*/\1/')
          ls dist/npm-release/*.tgz \
            | sed -E "s|.*/deepseek-ai-(.*)-${version}\.tgz\$|@deepseek-ai/\1|" \
            | while read -r pkg; do npm dist-tag add "$pkg@${version}" latest; done

  deploy-staging:
    needs: release
    runs-on: dsh-host
    env:
      TAG: ${{ gitea.ref_name }}
    steps:
      - name: Checkout the released tag and restart staging
        run: |
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          cd /home/<user>/Projects/deepseek-harness
          git fetch origin --tags --prune
          git checkout --force "refs/tags/$TAG"
          pnpm install --frozen-lockfile
          pnpm run build:web
          systemctl --user restart dsh-staging
          systemctl --user is-active dsh-staging
